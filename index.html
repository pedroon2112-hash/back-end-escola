<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Alunos</title>

    <style>
:root {
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --danger-color: #ef4444;
    --danger-hover: #dc2626;
    --edit-color: #f59e0b;
    --edit-hover: #d97706;
    --bg-color: #f9fafb;
    --surface-color: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --radius: 12px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 2rem;
}

.container {
    width: 100%;
    max-width: 1000px;
    background-color: var(--surface-color);
    border-radius: var(--radius);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    overflow: hidden;
}

header {
    background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    color: white;
    padding: 2rem;
    text-align: center;
}

header h1 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

header p {
    opacity: 0.9;
    font-size: 1rem;
}

main {
    padding: 2rem;
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 2rem;
}

@media (max-width: 768px) {
    main {
        grid-template-columns: 1fr;
    }
}

/*forms*/
.form-section {
    background: #f9fafb;
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
}

.form-section h2,
.list-section h2 {
    margin-bottom: 1rem;
    font-size: 1.25rem;
    color: var(--text-main);
}

.input-group {
    margin-bottom: 1.25rem;
}

.input-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-main);
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color 0.3s;
}

.input-group input:focus,
.input-group select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.form-actions {
    display: flex;
    margin-top: 1.5rem;
    gap: 1.5rem;
}

button {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.btn-save {
    background-color: var(--primary-color);
    color: white;
    flex: 1;
}

.btn-save:hover {
    background-color: var(--primary-hover);
}

.btn-cancel {
    background-color: var(--border-color);
    color: var(--text-main);
}

.btn-cancel:hover {
    background-color: #d1d5db;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 1rem;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
}

td {
    background-color: #f9fafb;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.87rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

tbody tr {
    transition: background-color 0.2s;
}

tbody tr:hover {
    background-color: #f9fafb;
}

.actions {
    display: flex;
    gap: 0.5rem;
}

.btn-icon {
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.875rem;

}

.btn-edit {
    background-color: var(--edit-color);
    color: white;
}

.btn-edit:hover {
    background-color: var(--edit-hover);
}

.btn-delete {
    background-color: var(--danger-color);
    color: white;
}

.btn-delete:hover {
    background-color: var(--danger-hover);

    @media print {
        @page {
            size: A4 landscape;
            margin: 0.5cm;
        }

        body {
            background-color: white;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        .container {
            box-shadow: none;
            max-width: 100%;
            width: 100%;
            margin: 0;
            border-radius: 0;
        }

        header,
        .form-section,
        .actions,
        .list-section h2 {
            display: none !important;
        }
      main{
        display: block;
        padding: 0;
        grid-template-columns: 1fr;
      }
      .list-section {
        padding: 0;
      }
      table{
        page-break-inside: auto;
        width: 100%;
      }
      th, td {
        padding: 12px;
        font-size: 14px;
        border: 1px solid #000;
      }
      tr{
        page-break-inside: avoid;
        page-break-after: auto;
      }
    }
}
/* Tabela com novos campos */
.table-container { overflow-x: auto; }
table { min-width: 850px; }

</style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Painel de Alunos</h1>

            <p>Demonstração de CRUD Frontend/Backend (Node.js)</p>

            <button
                onclick="window.print()"
                style="
                    margin-top: 1rem;
                    padding: 10px 20px;
                    font-weight: bold;
                    cursor: pointer;
                    border-radius: 8px;
                    border: none;
                    background: white;
                    color: var(--primary-color);
                "
            >
                ⬇️ Baixar PDF
            </button>
        </header>


        <main>

            <!-- FORMULÁRIO -->
            <section class="form-section">

                <h2>Novo Aluno</h2>

                <form id="aluno-form">

                    <!-- ID usado na edição -->
                    <input type="hidden" id="aluno-id">


                    <div class="input-group">

                        <label for="nome">
                            Nome Completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            required
                            placeholder="Ex: Fulano de Tal"
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="Ex: email@email.com"
                        >

                    </div>


                    <div class="input-group">

                        <label for="curso">
                            Curso
                        </label>

                        <select id="curso" required>

                            <option value="">
                                Selecione um curso...
                            </option>

                            <option value="Análise de Sistemas">
                                Análise de Sistemas
                            </option>

                            <option value="Engenharia de Software">
                                Engenharia de Software
                            </option>

                            <option value="Ciência da Computação">
                                Ciência da Computação
                            </option>

                        </select>

                    </div>



                    <div class="input-group"><label for="cpf">CPF</label><input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></div>
                    <div class="input-group"><label for="telefone">Telefone</label><input id="telefone" type="tel" inputmode="tel" maxlength="15" placeholder="(62) 99999-9999" required></div>
                    <div class="input-group"><label for="idade">Idade</label><input id="idade" type="number" min="0" max="120" placeholder="Idade em anos" required></div>

                    <div class="form-actions">

                        <button
                            type="button"
                            class="btn-cancel"
                            id="btn-cancel"
                            style="display: none;"
                        >
                            Cancelar Edição
                        </button>

                        <button
                            type="submit"
                            class="btn-save"
                            id="btn-save"
                        >
                            Salvar Aluno
                        </button>

                    </div>

                </form>

            </section>


            <!-- LISTA DE ALUNOS -->
            <section class="list-section">

                <h2>Alunos Cadastrados</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Nome</th>

                                <th>E-mail</th>

                                <th>Curso</th><th>CPF</th><th>Telefone</th><th>Idade</th>

                                <th>Ações</th>

                            </tr>

                        </thead>


                        <tbody id="alunos-tbody">

                            <!--
                                Os alunos serão inseridos
                                aqui pelo script.js
                            -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- IMPORTANTE: carrega o JavaScript -->
    <script src="./script.js"></script>

</body>

</html>
